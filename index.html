<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#7b6cff">

<title>Para Ti 💌</title>

<link href="https://fonts.googleapis.com/css2?family=Kalam:wght@300;400&display=swap" rel="stylesheet">

<style>
*{
  box-sizing:border-box;
  font-family:'Poppins', Arial, sans-serif;
}

body{
  margin:0;
  min-height:100vh;
  background:radial-gradient(circle at top,#1b0033,#05000f);
  overflow:hidden;
  color:white;
}

/* ❤️ Corazones */
.heart{
  position:absolute;
  bottom:-40px;
  animation:float 8s linear infinite;
  opacity:.8;
}

@keyframes float{
  0%{transform:translateY(0) scale(1);}
  100%{transform:translateY(-120vh) scale(1.4); opacity:0;}
}

/* 📦 Contenedor */
.container{
  min-height:100vh;
  display:flex;
  justify-content:center;
  align-items:center;
  text-align:center;
  padding:20px;
}

/* 💎 Texto neón */
.neon{
  font-size:2.8rem;
  background:linear-gradient(90deg,#ff4ecd,#7b6cff,#00f5ff,#ff4ecd);
  background-size:300%;
  -webkit-background-clip:text;
  color:transparent;
  animation:shine 4s linear infinite;
}

@keyframes shine{
  to{background-position:300%;}
}

/* Botones */
.buttons{
  margin-top:30px;
  display:flex;
  justify-content:center;
  gap:20px;
}

button{
  border:none;
  padding:14px 30px;
  font-size:1.2rem;
  border-radius:14px;
  cursor:pointer;
  color:white;
}

#yes{
  background:linear-gradient(135deg,#ff4ecd,#7b6cff);
}

#no{
  background:linear-gradient(135deg,#495057,#212529);
  position:relative;
}

/* 💌 CARTA */
#letter{ display:none; }

.letter-paper{
  background:
    radial-gradient(circle at top left,#3a2d1c 0%,transparent 40%),
    radial-gradient(circle at top right,#3a2d1c 0%,transparent 40%),
    radial-gradient(circle at bottom left,#3a2d1c 0%,transparent 40%),
    radial-gradient(circle at bottom right,#3a2d1c 0%,transparent 40%),
    linear-gradient(#fffaf0,#f3e9dc);
  color:#2b1d0e;
  max-width:900px;
  width:100%;
  padding:40px 50px;
  box-shadow:0 20px 45px rgba(0,0,0,.45);
  text-align:left;
}

/* 📸 Foto */
.pig{
  width:180px;
  height:180px;
  background:url("imagenes/img.jpeg") center/cover no-repeat;
  float:right;
  margin-left:25px;
  border-radius:6px;
  transform:rotate(-4deg);
  box-shadow:0 10px 25px rgba(0,0,0,.4),
             inset 0 0 25px rgba(120,70,20,.45);
}

/* ✍️ Texto */
.letter-title,
.letter-text,
.signature,
.date{
  font-family:'Kalam', sans-serif;
}

.letter-title{
  font-size:1.7rem;
  margin-bottom:22px;
}

.letter-text{
  font-size:1.25rem;
  line-height:2.1;
  white-space:pre-wrap;
}

.signature{ font-size:1.5rem; }
.date{ opacity:.7; }

@media(max-width:768px){
  .pig{
    float:none;
    margin:0 auto 20px;
    display:block;
  }
}
</style>
</head>

<body>

<div class="container">

  <div id="question">
    <h1 class="neon">¿Quieres ser mi Valentine Day? 💜</h1>
    <div class="buttons">
      <button id="yes">Sí 💕</button>
      <button id="no">No 😳</button>
    </div>
  </div>

  <div id="letter">
    <div class="letter-paper">
      <div class="pig"></div>
      <div class="letter-title">Para ti, Corazón</div>
      <div id="typedText" class="letter-text"></div>
    </div>
  </div>

</div>

<script>
// ❤️ corazones
setInterval(()=>{
  const h=document.createElement("div");
  h.className="heart";
  h.innerHTML="💜";
  h.style.left=Math.random()*100+"vw";
  h.style.fontSize=(14+Math.random()*22)+"px";
  document.body.appendChild(h);
  setTimeout(()=>h.remove(),10000);
},500);

// ✍️ TEXTO LETRA POR LETRA
const text = `Gracias por estar conmigo y por aguantarme tal como soy.

Perdón por mis errores y por las veces que no hago las cosas bien.

Quiero que sepas que todo lo que hago es pensando en ti y en lo nuestro.
No soy perfecto, pero mis intenciones contigo siempre son sinceras.

Te amo y valoro mucho tenerte a mi lado.

-Kevin.
01/01/21 ♡`;

let i = 0;
function type(){
  if(i < text.length){
    document.getElementById("typedText").innerHTML += text.charAt(i);
    i++;
    setTimeout(type, 40); // velocidad
  }
}

// BOTONES
yes.onclick=()=>{
  question.style.display="none";
  letter.style.display="block";
  type();
};

// ❌ NO IMPOSIBLE
no.addEventListener("mouseenter",()=>{
  no.style.transform =
    `translate(${Math.random()*200-100}px,${Math.random()*120-60}px)`;
});
</script>

<script>
if ("serviceWorker" in navigator) {
  navigator.serviceWorker.register("service-worker.js")
    .then(() => console.log("Service Worker registrado 💜"))
    .catch(err => console.log("Error:", err));
}
</script>


</body>
</html>
