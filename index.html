<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Para Ti 💌</title>

<link href="https://fonts.googleapis.com/css2?family=Kalam:wght@300;400&family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

body{
  font-family:'Poppins', sans-serif;
  background:radial-gradient(circle at top,#1b0033,#05000f);
  color:white;
  overflow-x:hidden;
}

/* ❤️ Corazones */
.heart{
  position:fixed;
  bottom:-40px;
  animation:float 8s linear infinite;
  opacity:.8;
  pointer-events:none;
  z-index:0;
}

@keyframes float{
  0%{transform:translateY(0) scale(1);}
  100%{transform:translateY(-120vh) scale(1.4); opacity:0;}
}

/* 📦 Contenedor general */
.section{
  min-height:100vh;
  display:flex;
  justify-content:center;
  align-items:center;
  padding:40px 20px;
  position:relative;
  z-index:1;
}

/* 💎 Título */
.neon{
  font-size:clamp(1.8rem,5vw,3rem);
  text-align:center;
  background:linear-gradient(90deg,#ff4ecd,#7b6cff,#00f5ff,#ff4ecd);
  background-size:300%;
  -webkit-background-clip:text;
  color:transparent;
  animation:shine 4s linear infinite;
}

@keyframes shine{
  to{background-position:300%;}
}

/* Botones */
.buttons{
  margin-top:40px;
  display:flex;
  gap:20px;
  justify-content:center;
  flex-wrap:wrap;
}

button{
  border:none;
  padding:14px 32px;
  font-size:1rem;
  border-radius:14px;
  cursor:pointer;
  color:white;
  transition:.3s;
}

#yes{
  background:linear-gradient(135deg,#ff4ecd,#7b6cff);
}

#yes:hover{
  transform:scale(1.08);
}

#no{
  background:linear-gradient(135deg,#495057,#212529);
  position:relative;
}

/* 💌 CARTA */
#letter{
  display:none;
  padding:60px 20px;
}

.letter-wrapper{
  max-width:900px;
  margin:auto;
}

.letter-paper{
  background:
    radial-gradient(circle at top left,#3a2d1c 0%,transparent 40%),
    radial-gradient(circle at top right,#3a2d1c 0%,transparent 40%),
    radial-gradient(circle at bottom left,#3a2d1c 0%,transparent 40%),
    radial-gradient(circle at bottom right,#3a2d1c 0%,transparent 40%),
    linear-gradient(#fffaf0,#f3e9dc);
  color:#2b1d0e;
  padding:clamp(25px,5vw,60px);
  border-radius:12px;
  box-shadow:0 20px 45px rgba(0,0,0,.4);
}

/* Imagen */
.pig{
  width:160px;
  height:160px;
  background:url("imagenes/img.jpeg") center/cover no-repeat;
  border-radius:6px;
  transform:rotate(-4deg);
  box-shadow:0 10px 25px rgba(0,0,0,.4);
  margin-bottom:25px;
}

/* Texto carta */
.letter-title{
  font-family:'Kalam', sans-serif;
  font-size:1.7rem;
  margin-bottom:20px;
}

.letter-text{
  font-family:'Kalam', sans-serif;
  font-size:1.25rem;
  line-height:2;
  white-space:pre-wrap;
}

/* Responsive real */
@media (min-width:768px){
  .letter-content{
    display:flex;
    gap:30px;
  }

  .pig{
    flex-shrink:0;
  }
}

</style>
</head>

<body>

<!-- PREGUNTA -->
<section id="question" class="section">
  <div>
    <h1 class="neon">¿Quieres ser mi Valentine Day? 💜</h1>
    <div class="buttons">
      <button id="yes">Sí 💕</button>
      <button id="no">No 😳</button>
    </div>
  </div>
</section>

<!-- CARTA -->
<section id="letter">
  <div class="letter-wrapper">
    <div class="letter-paper">
      <div class="letter-content">
        <div class="pig"></div>
        <div>
          <div class="letter-title">Para ti, Corazón</div>
          <div id="typedText" class="letter-text"></div>
        </div>
      </div>
    </div>
  </div>
</section>

<script>
// ❤️ corazones
setInterval(()=>{
  const h=document.createElement("div");
  h.className="heart";
  h.innerHTML="💜";
  h.style.left=Math.random()*100+"vw";
  h.style.fontSize=(14+Math.random()*22)+"px";
  document.body.appendChild(h);
  setTimeout(()=>h.remove(),10000);
},500);

// ✍️ Texto
const text = `Gracias por estar conmigo y por aguantarme tal como soy.

Perdón por mis errores y por las veces que no hago las cosas bien.

Quiero que sepas que todo lo que hago es pensando en ti y en lo nuestro.
No soy perfecto, pero mis intenciones contigo siempre son sinceras.

Te amo y valoro mucho tenerte a mi lado.

-Kevin.
01/01/21 ♡`;

let i = 0;
function type(){
  if(i < text.length){
    document.getElementById("typedText").innerHTML += text.charAt(i);
    i++;
    setTimeout(type, 40);
  }
}

const yes = document.getElementById("yes");
const no = document.getElementById("no");
const question = document.getElementById("question");
const letter = document.getElementById("letter");

yes.onclick=()=>{
  question.style.display="none";
  letter.style.display="block";
  window.scrollTo({top:0,behavior:"smooth"});
  type();
};

no.addEventListener("mouseenter",()=>{
  no.style.transform =
    `translate(${Math.random()*200-100}px,${Math.random()*120-60}px)`;
});
</script>

</body>
</html>
